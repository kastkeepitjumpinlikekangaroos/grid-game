# A local cluster for trying the game's servers out (ops/kubernetes/CLAUDE.md): one node, with the
# ports players connect to mapped onto this machine's localhost (and nowhere else).
#
#   25570         the central server (TCP and UDP): log in at 127.0.0.1:25570
#   26000-26009   the match servers (TCP and UDP): Agones gives each GameServer one of these. Not
#                 Agones' default 7000-8000: macOS's AirPlay receiver listens on 7000.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
    extraPortMappings:
      - {containerPort: 25570, hostPort: 25570, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 25570, hostPort: 25570, listenAddress: 127.0.0.1, protocol: UDP}
      - {containerPort: 26000, hostPort: 26000, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 26000, hostPort: 26000, listenAddress: 127.0.0.1, protocol: UDP}
      - {containerPort: 26001, hostPort: 26001, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 26001, hostPort: 26001, listenAddress: 127.0.0.1, protocol: UDP}
      - {containerPort: 26002, hostPort: 26002, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 26002, hostPort: 26002, listenAddress: 127.0.0.1, protocol: UDP}
      - {containerPort: 26003, hostPort: 26003, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 26003, hostPort: 26003, listenAddress: 127.0.0.1, protocol: UDP}
      - {containerPort: 26004, hostPort: 26004, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 26004, hostPort: 26004, listenAddress: 127.0.0.1, protocol: UDP}
      - {containerPort: 26005, hostPort: 26005, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 26005, hostPort: 26005, listenAddress: 127.0.0.1, protocol: UDP}
      - {containerPort: 26006, hostPort: 26006, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 26006, hostPort: 26006, listenAddress: 127.0.0.1, protocol: UDP}
      - {containerPort: 26007, hostPort: 26007, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 26007, hostPort: 26007, listenAddress: 127.0.0.1, protocol: UDP}
      - {containerPort: 26008, hostPort: 26008, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 26008, hostPort: 26008, listenAddress: 127.0.0.1, protocol: UDP}
      - {containerPort: 26009, hostPort: 26009, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 26009, hostPort: 26009, listenAddress: 127.0.0.1, protocol: UDP}
